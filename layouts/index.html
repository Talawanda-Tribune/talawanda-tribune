{{ define "main" }}
    <h1>{{ .Title }}</h1>
    <div>
        <p id="date"></p>
        <script>
            const d = new Date();
            document.getElementById("date").innerHTML = d.toDateString();
        </script>
        {{ .Content }}
    </div>
{{/*    {{ partial "articleList.html" (dict "context" . "style" "standard")}}*/}}
    {{ partial "articleList.html" (dict "context" . "lists" ( slice
        (dict "style" "featured" "count" 1)
        (dict "style" "standard" "count" 18)
     ))}}

{{ end }}
