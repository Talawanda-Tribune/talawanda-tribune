name: Deploy Hugo site to Pages

on:
#  push:
#    branches: ["master"]
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload (JSON)
        required: true
        type: string
        default: '{}'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo image processing
        uses: actions/cache@v4
        with:
          path: resources/_gen/images
          key: hugo-images-${{ runner.os }}-${{ hashFiles('assets/media/**', 'layouts/partials/responsive-image.html', 'layouts/_default/_markup/render-image.html', 'hugo.toml') }}
          restore-keys: |
            hugo-images-${{ runner.os }}-

      - name: Show repo tree before build
        run: |
          pwd
          echo "--- ls -la ---"
          ls -la
          echo "--- root files ---"
          find . -maxdepth 2 -print | sort
          echo "--- content tree ---"
          find content -maxdepth 4 -print | sort
          echo "--- config files ---"
          ls -la *.toml .*.yml .*.yaml 2>/dev/null || true

      - name: Download and Install Hugo Binary
        run: |
          curl -L "https://github.com/gohugoio/hugo/releases/download/v0.170.1/hugo_extended_0.170.1_Linux-64bit.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Compile Static Site
        run: |
          rm -rf public
          echo "--- running hugo ---"
          hugo --cleanDestinationDir
          echo "--- public files ---"
          find public -maxdepth 4 -type f | sort
          echo "--- public tree ---"
          find public -maxdepth 4 -print | sort
          touch ./public/.nojekyll

      - name: Upload Build Output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
