name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repo tree before build
        run: |
          pwd
          echo "--- ls -la ---"
          ls -la
          echo "--- root files ---"
          find . -maxdepth 2 -print | sort
          echo "--- content tree ---"
          find content -maxdepth 4 -print | sort
          echo "--- config files ---"
          ls -la *.toml .*.yml .*.yaml 2>/dev/null || true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Compile Static Site
        run: |
          rm -rf public
          echo "--- running hugo ---"
          hugo --cleanDestinationDir --verbose --destination public
          echo "--- public files ---"
          find public -maxdepth 4 -type f | sort
          echo "--- public tree ---"
          find public -maxdepth 4 -print | sort
          touch ./public/.nojekyll

      - name: Upload Build Output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
